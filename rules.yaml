# rules.yaml

qbittorrent:
  # url: "http://127.0.0.1:8080"
  url: "http://qbittorrent-host:8113"
  # username: "admin"
  # password: "adminadmin"

logging:
  max_days: 30
  enable_notifications: true

schedule:
  enabled: true
  interval_seconds: 30  # how often the Windows service runs all rules

web:
  port: 8002
  username: "admin"
  password: "change-me"
  enable_auth: true

notifications:
  email:
    # Email when cleanup fails failure_threshold runs in a row (off by default).
    enabled: false
    smtp_host: "smtp.example.com"
    smtp_port: 587
    starttls: true             # STARTTLS on port 587
    use_ssl: false             # true for implicit TLS (usually port 465)
    username: "user@example.com"
    password: ""               # blank = read env var named in password_env
    password_env: "QB_CLEANER_SMTP_PASSWORD"
    from_address: "user@example.com"
    to: ["user@example.com"]
    failure_threshold: 10      # consecutive failed runs before emailing
    cooldown_hours: 6          # at most one failure email per this many hours
    send_recovery: true        # one email when cleanup works again

rules:
  - name: "Auto-clean inactive labeled torrents : >=40 days"
    match:
      category_in: ["radarr", "tv-sonarr"]
      last_activity_hours_gte: 960
    action:
      delete_torrent: true
      delete_files: true

  # - name: "Remove completed torrents with ratio > 3"
