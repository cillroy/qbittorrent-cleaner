{% extends "base.html" %}

{% block title %}Logs - qBittorrent Cleaner{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-file-alt"></i> Application Logs</h2>
            <div>
                <button class="btn btn-outline-secondary" onclick="refreshLogs()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
                <a href="/static/logs/qb-cleaner.log" class="btn btn-outline-primary" target="_blank">
                    <i class="fas fa-download"></i> Download Full Log
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <pre id="logContent" style="max-height: 600px; overflow-y: auto; background: #f8f9fa; padding: 15px; border-radius: 5px; font-family: 'Courier New', monospace; font-size: 0.9em; line-height: 1.4;">
{% for log in logs %}
{{ log }}{% endfor %}
                </pre>
            </div>
        </div>

        <div class="mt-3 text-muted">
            <small>Showing last {{ logs|length }} log entries. <a href="/static/logs/qb-cleaner.log" target="_blank">View full log file</a></small>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function refreshLogs() {
    fetch('/logs')
        .then(response => response.text())
        .then(html => {
            // Extract the log content from the HTML response
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const newLogContent = doc.getElementById('logContent').innerHTML;
            document.getElementById('logContent').innerHTML = newLogContent;
        })
        .catch(error => {
            console.error('Error refreshing logs:', error);
        });
}

// Auto-refresh every 30 seconds
setInterval(refreshLogs, 30000);
</script>
{% endblock %}
